name: Daily Discord Alert

on:
  schedule:
    # UTC 00:00 = KST 09:00
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-discord-alert
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-daily-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate webhook secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is missing."
            exit 1
          fi

      - name: Compile
        run: mvn -q -DskipTests compile

      - name: Run one-time alert job
        env:
          RUN_ONCE: "true"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: mvn -q exec:java -Dexec.mainClass=Main

      - name: Generate public contests page
        run: mvn -q exec:java -Dexec.mainClass=PageGenerator

      - name: Commit sent id history if changed
        id: commit_changes
        run: |
          if git diff --quiet -- sent_ids.txt alert_history.tsv docs/index.html; then
            echo "No sent_ids.txt/alert_history/docs changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_ids.txt alert_history.tsv docs/index.html
          git commit -m "chore: update alert state and page"

          if ! git push; then
            echo "First push failed. Retrying after rebase..."
            git pull --rebase origin main
            git push
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: steps.commit_changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.commit_changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        if: steps.commit_changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4