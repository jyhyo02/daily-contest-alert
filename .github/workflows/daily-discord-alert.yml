name: Daily Discord Alert

on:
  schedule:
    # UTC 00:00 = KST 09:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile
        run: mvn -q -DskipTests compile

      - name: Run one-time alert job
        env:
          RUN_ONCE: "true"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: mvn -q exec:java -Dexec.mainClass=Main

      - name: Commit sent id history if changed
        run: |
          if git diff --quiet -- sent_ids.txt; then
            echo "No sent_ids.txt changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_ids.txt
          git commit -m "chore: update sent ids [skip ci]"
          git push
